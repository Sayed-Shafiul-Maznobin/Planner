<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar App</title>



    <!-- PWA Meta Tags -->
<meta name="theme-color" content="#2563eb">
<meta name="description" content="A minimalist offline calendar with to-do notes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calendar">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%232563eb' width='180' height='180'/><text x='50%' y='50%' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dy='.3em'>📅</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232563eb' width='100' height='100'/><text x='50' y='50' font-size='60' font-weight='bold' fill='white' text-anchor='middle' dy='.3em'>📅</text></svg>">




    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Safe edge margins for glass protector -->
        <div class="safe-area">
            <!-- Header -->
            <header class="header">
                <div class="header-nav">
                    <button class="btn-nav btn-prev" aria-label="Previous month">
                        <span>←</span>
                    </button>
                    
                    <div class="header-title">
                        <h1 id="monthYear" class="month-year">Month Year</h1>
                        <button class="btn-today" id="todayBtn">Today</button>
                    </div>
                    
                    <button class="btn-nav btn-next" aria-label="Next month">
                        <span>→</span>
                    </button>
                </div>

                <!-- Date Jump Navigation -->
                <div class="date-jump">
                    <select id="yearSelect" class="select-input" aria-label="Select year">
                        <option value="">Year</option>
                    </select>
                    <select id="monthSelect" class="select-input" aria-label="Select month">
                        <option value="">Month</option>
                        <option value="0">January</option>
                        <option value="1">February</option>
                        <option value="2">March</option>
                        <option value="3">April</option>
                        <option value="4">May</option>
                        <option value="5">June</option>
                        <option value="6">July</option>
                        <option value="7">August</option>
                        <option value="8">September</option>
                        <option value="9">October</option>
                        <option value="10">November</option>
                        <option value="11">December</option>
                    </select>
                    <select id="daySelect" class="select-input" aria-label="Select day">
                        <option value="">Day</option>
                    </select>
                </div>
            </header>

            <!-- Calendar -->
            <main class="calendar-container">
                <!-- Weekday headers -->
                <div class="weekday-header">
                    <div class="weekday">Sun</div>
                    <div class="weekday">Mon</div>
                    <div class="weekday">Tue</div>
                    <div class="weekday">Wed</div>
                    <div class="weekday">Thu</div>
                    <div class="weekday">Fri</div>
                    <div class="weekday">Sat</div>
                </div>

                <!-- Calendar grid -->
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Generated by JavaScript -->
                </div>
            </main>
        </div>
    </div>

    <!-- Modal for adding/editing to-do -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add To-Do</h2>
            </div>

            <form class="modal-form" id="modalForm">
                <textarea 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="Enter your to-do (or separate multiple with line breaks)..."
                    aria-label="To-do input"
                ></textarea>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-disabled" id="saveBtn">Save</button>
                    <button type="button" class="btn btn-danger btn-delete" id="deleteBtn">
                        <span class="delete-text">Delete</span>
                        <span class="delete-progress"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal overlay -->
    <div class="modal-overlay" id="modalOverlay"></div>

    <script src="script.js"></script>



    <!-- Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('Service Worker registered'))
        .catch(err => console.log('Service Worker registration failed'));
    });
  }
</script>




</body>
</html>

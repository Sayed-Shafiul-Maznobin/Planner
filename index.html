<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Safe edge margins for glass protector -->
        <div class="safe-area">
            <!-- Header -->
            <header class="header">
                <div class="header-nav">
                    <button class="btn-nav btn-prev" aria-label="Previous month">
                        <span>←</span>
                    </button>
                    
                    <div class="header-title">
                        <h1 id="monthYear" class="month-year">Month Year</h1>
                        <button class="btn-today" id="todayBtn">Today</button>
                    </div>
                    
                    <button class="btn-nav btn-next" aria-label="Next month">
                        <span>→</span>
                    </button>
                </div>

                <!-- Date Jump Navigation -->
                <div class="date-jump">
                    <select id="yearSelect" class="select-input" aria-label="Select year">
                        <option value="">Year</option>
                    </select>
                    <select id="monthSelect" class="select-input" aria-label="Select month">
                        <option value="">Month</option>
                        <option value="0">January</option>
                        <option value="1">February</option>
                        <option value="2">March</option>
                        <option value="3">April</option>
                        <option value="4">May</option>
                        <option value="5">June</option>
                        <option value="6">July</option>
                        <option value="7">August</option>
                        <option value="8">September</option>
                        <option value="9">October</option>
                        <option value="10">November</option>
                        <option value="11">December</option>
                    </select>
                    <select id="daySelect" class="select-input" aria-label="Select day">
                        <option value="">Day</option>
                    </select>
                </div>
            </header>

            <!-- Calendar -->
            <main class="calendar-container">
                <!-- Weekday headers -->
                <div class="weekday-header">
                    <div class="weekday">Sun</div>
                    <div class="weekday">Mon</div>
                    <div class="weekday">Tue</div>
                    <div class="weekday">Wed</div>
                    <div class="weekday">Thu</div>
                    <div class="weekday">Fri</div>
                    <div class="weekday">Sat</div>
                </div>

                <!-- Calendar grid -->
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Generated by JavaScript -->
                </div>
            </main>
        </div>
    </div>

    <!-- Modal for adding/editing to-do -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add To-Do</h2>
            </div>

            <form class="modal-form" id="modalForm">
                <textarea 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="Enter your to-do (or separate multiple with line breaks)..."
                    aria-label="To-do input"
                ></textarea>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-disabled" id="saveBtn">Save</button>
                    <button type="button" class="btn btn-danger btn-delete" id="deleteBtn">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal overlay -->
    <div class="modal-overlay" id="modalOverlay"></div>

    <script src="script.js"></script>
</body>
</html>
